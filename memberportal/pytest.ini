[pytest]
DJANGO_SETTINGS_MODULE = membermatters.settings
python_files = test_*.py
testpaths = tests

# membermatters.settings defaults every path to a Docker location (/usr/src/...)
# and opens the log file at import time, so these must be set before
# pytest-django calls django.setup(). Paths are relative to the rootdir
# (memberportal/); *.log and db.sqlite3 are already gitignored.
env =
    D:MM_ENV=Development
    D:MM_LOG_LOCATION=.pytest-django.log
    D:MM_DB_LOCATION=.pytest-db.sqlite3
    D:MM_MEDIA_LOCATION=.pytest-media/
    D:MM_STATIC_LOCATION=.pytest-static

# Characterisation tests describe the system as it behaves TODAY, on Django 3.2.
# They are the acceptance criteria for the Django 4.2 -> 5.2 upgrade: green before,
# green after. Prefer asserting observable contracts (payloads, status codes, DB
# state) over implementation details, so they survive the framework move.

addopts =
    --strict-markers
    --reuse-db
    -ra

# Consumers are tested through channels' WebsocketCommunicator, which needs a
# running event loop per test.
asyncio_mode = auto

markers =
    protocol: device WebSocket protocol contract (de-risks channels 3 -> 4)
    config: Constance runtime settings contract (de-risks constance 2 -> 4)

filterwarnings =
    default
    # Django 3.2 + pytz emits this constantly; it is a real finding, tracked separately.
    ignore:.*naive datetime.*:RuntimeWarning
